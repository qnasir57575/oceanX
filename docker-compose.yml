# Local PostgreSQL for development and contract tests.
#   npm run db:up      -> starts Postgres on localhost:5434
#   npm run db:down    -> stops it (data persists in the named volume)
#
# Two databases are created:
#   oceanx       - development database (DATABASE_URL)
#   oceanx_test  - used by `npm run test:contract` (TEST_DATABASE_URL)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: oceanx_dev_password
      POSTGRES_DB: oceanx
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - oceanx-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanx -d oceanx"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  oceanx-pgdata:
